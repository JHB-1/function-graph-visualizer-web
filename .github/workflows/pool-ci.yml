name: Pooled build and tests
run-name: ${{ inputs.pool_title || format('{0} / {1} / {2} / {3}', github.event.repository.name, inputs.pool_profile, inputs.pool_sha, inputs.pool_request)
    }}
'on':
    workflow_dispatch:
        inputs:
            pool_title:
                type: string
                required: false
            pool_runner:
                type: string
                required: true
            pool_request:
                type: string
                required: true
            pool_sha:
                type: string
                required: true
            pool_profile:
                type: choice
                options:
                - linux
                required: true
permissions:
    contents: read
    pages: write
    id-token: write
jobs:
    build:
        if: github.repository == 'JHB-1/function-graph-visualizer-web' && github.ref == 'refs/heads/main'
        runs-on: ${{ fromJSON(inputs.pool_runner) }}
        timeout-minutes: 45
        defaults:
            run:
                shell: bash
        env:
            POOL_PROFILE: ${{ inputs.pool_profile }}
            CMAKE_BUILD_PARALLEL_LEVEL: '2'
            POOL_SHA: ${{ inputs.pool_sha }}
        steps:
        -   name: pool/${{ inputs.pool_request }}/${{ inputs.pool_profile }}/${{ inputs.pool_sha }}
            shell: python3 {0}
            env:
                POOL_REQUEST: ${{ inputs.pool_request }}
                POOL_SHA: ${{ inputs.pool_sha }}
                POOL_PROFILE: ${{ inputs.pool_profile }}
                POOL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
            run: |
                from pathlib import Path
                import os
                import re
                values = [os.environ[key] for key in ('GITHUB_REPOSITORY', 'GITHUB_REF_NAME', 'POOL_PROFILE',
                    'POOL_SHA', 'POOL_REQUEST', 'POOL_RUNNER_ENVIRONMENT')]
                patterns = [r'JHB-1/function-graph-visualizer-web', r'main', r'linux', r'[0-9a-f]{40}', r'[0-9a-f]{32}',
                    r'(?:self-hosted|github-hosted)']
                if not all(re.fullmatch(pattern, value) for pattern, value in zip(patterns, values)):
                    raise ValueError('Invalid pool metadata')
                labels = ['Repository', 'Branch', 'Profile', 'Source SHA', 'Request', 'Environment']
                text = '## Build and tests\n\n| Field | Value |\n| --- | --- |\n'
                text += '\n'.join(f'| {label} | `{value}` |' for label, value in zip(labels, values))
                text += f'\n\n[Source commit](https://github.com/{values[0]}/commit/{values[3]})\n'
                with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as output:
                    output.write(text)
        -   uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
            with:
                ref: ${{ inputs.pool_sha }}
                persist-credentials: false
        -   uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
            if: runner.environment != 'self-hosted'
            with:
                node-version: '24'
        -   name: Install locked dependencies
            run: npm ci
        -   name: Verify Node.js 24
            run: node -e "if(process.versions.node.split('.')[0] !== '24') throw new Error('Node 24 required')"
        -   name: Fetch verified WASM and build
            run: |
                npm run runtime
                npm run build
        -   name: Native WASM contracts
            run: node --test tests/runtime.mjs
        -   name: Pages routing and immutable asset regression
            run: node --test tests/pooled-ci.mts
        -   name: Install browser with hosted system dependencies
            if: runner.environment == 'github-hosted'
            run: npx playwright install --with-deps chromium
        -   name: Install browser using provisioned Linux libraries
            if: runner.environment == 'self-hosted'
            run: npx playwright install chromium
        -   name: Full browser regression
            run: npm test
        -   name: Checkout immutable public compatibility assets
            uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
            with:
                ref: 409e518fdc90bd5a82136874f1622fc878670a1b
                path: build-legacy-pages
                persist-credentials: false
        -   name: Preserve immutable asset URLs
            run: node tools/preserve_pages.mts
        -   name: Deploy only the current trusted head
            id: head
            env:
                GITHUB_TOKEN: ${{ github.token }}
            run: node tools/pages_head.mts
        -   name: Upload Pages artifact
            if: steps.head.outputs.deploy == 'true'
            uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
            with:
                path: dist
        -   name: Deploy Pages
            if: steps.head.outputs.deploy == 'true'
            id: deployment
            uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        -   uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
            if: always()
            with:
                name: web-browser-evidence
                path: test-results/
                retention-days: 7
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
